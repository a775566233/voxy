name: Build Java JAR with Gradle
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4
    # 2. 设置 JDK 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    # 3. 赋予 gradlew 执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # 4. 执行 Gradle 打包命令
    - name: Build with Gradle
      run: ./gradlew build -x test
    # 5. 上传打包好的 JAR 到 GitHub
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-jar
        # Gradle 的 jar 通常在 build/libs/ 下
        path: build/libs/*.jar
        retention-days: 5
