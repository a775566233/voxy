name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 JDK 21 (Fabric 1.20.5+ 通常需要 JDK 21)
    # 根据日志看来你用的是 Java 21，如果不是请自行修改 '21' 为 '17'
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    # 3. 赋予 gradlew 执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行打包 (这是纯净的打包命令，没有任何依赖提交的参数)
    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: build
        # ⚠️ 关键点：不要在这里加 dependency-graph: generate-and-submit

    # 5. 上传 JAR 包
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-jar
        # Fabric 通常会生成两个 jar，一个是 -dev (开发用)，一个是正常的。
        # 我们只上传 build/libs 下的所有 jar
        path: build/libs/*.jar
        retention-days: 5
